name: 抓取体彩赔率

# 2026-09-01 起停用定时抓取：世界杯已闭幕(WCC 池为空,跑了会用空数据覆盖现有展示)，
# 且体彩 EdgeOne WAF 同时封锁 GitHub/Cloudflare 出口 IP(567)，云端无法补采。
# 赔率数据保持世界杯收官快照，前端「体彩世界」展示现状不变。保留手动触发备用。
on:
  workflow_dispatch:

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取体彩赔率
        env:
          # 通过 Cloudflare Workers 反代绕过腾讯云 WAF 对 GitHub IP 的拦截
          # 在 repo Settings → Secrets → Actions 配置 ODDS_PROXY_URL
          ODDS_PROXY_URL: ${{ secrets.ODDS_PROXY_URL }}
        run: node scripts/fetch-odds.js

      - name: 提交更新（如有变化）
        run: |
          if git diff --quiet data/lottery-odds.json; then
            echo "赔率数据无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/lottery-odds.json
            git commit -m "更新体彩赔率数据 [skip ci]"
            git push
            echo "赔率数据已更新并推送"
          fi
